repos:
  - repo: local
    hooks:
      - id: swift-format
        name: swift format lint
        entry: swift format lint --strict -r Sources Tests Package.swift
        language: system
        files: \.swift$
        pass_filenames: false
      - id: swift-test
        name: swift test
        entry: swift test
        language: system
        files: \.swift$
        pass_filenames: false
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
      - id: plist-lint
        name: plutil lint
        entry: plutil -lint
        language: system
        files: \.plist$
